<!doctype html>
<html class="no-js" lang="">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        <link rel="shortcut icon" href="favicon.ico?v=2" />
        <link rel="stylesheet" href="style.css">

        <script src="js/vendor/modernizr-2.8.3.min.js"></script>
        <style>

            @media (max-width: 768px) {
                #background-site iframe[src^="https://script.google.com/macros/s/"] {
                    position: absolute;
                    inset: 60px 0 auto;
                    display: block;
                    height: calc(100vh - 60px);
                    height: calc(100dvh - 60px);
                }
                #background-site:has(iframe[src^="https://docs.google.com/document/"]) {
                    overflow-x: hidden;
                }
                #background-site iframe[src^="https://docs.google.com/document/"] {
                    width: calc(100% / 0.9);
                    transform: scale(0.9);
                    transform-origin: top left;
                }
                #menu:not(.border) {
                    right: auto;
                    padding: 4px;
                    background: transparent;
                    border-color: transparent;
                    box-shadow: none;
                }
                #menu #menu-open {
                    width: 44px;
                    height: 44px;
                    box-sizing: border-box;
                    padding: 10px;
                }
                #menu #menu-open div {
                    width: 24px;
                    height: 3px;
                    margin-bottom: 5px;
                    background: #f00;
                    border: 0;
                }
                #background-site iframe[src^="https://docs.google.com/presentation/"],
                #background-site iframe[src^="https://player.vimeo.com/video/"] {
                    position: absolute;
                    inset: 68px 0 auto;
                    height: min(calc(56.25vw + 40px), calc(100vh - 68px));
                    height: min(calc(56.25vw + 40px), calc(100dvh - 68px));
                }
            }
        </style>
    </head>
    <body>
        <!--[if lt IE 8]>
            <p class="browserupgrade">You are using an <strong>outdated</strong> browser. Please <a href="http://browsehappy.com/">upgrade your browser</a> to improve your experience.</p>
        <![endif]-->
        <img id="logo" src="logo.png">
        <div class="about"></div>

        <div id="menu">
            <!-- <img id="binder-clip" src="binder-clip.png">  -->   
            <div id="menu-open">
                <div></div>
                <div></div>
                <div></div>
            </div>
            <img id="logo-touch" src="logo.png">
            <ul id="navigation">
            </ul>
        </div>

        <div id="background-site"><iframe name="backgrnd" id="backgrnd" scrolling="yes" src="" allowfullscreen></iframe></div>

        <script src="//ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
        <script>window.jQuery || document.write('<script src="js/vendor/jquery-1.11.2.min.js"><\/script>')</script>
        <script src="//code.jquery.com/ui/1.11.4/jquery-ui.js"></script>
        <script src="js/vendor/jquery.ui.touch-punch.min.js"></script>
        <script src="js/google-docs-site.1.0.js?v=agency"></script>

        <!-- Google Analytics: change UA-XXXXX-X to be your site's ID. -->
        <script>
            (function(b,o,i,l,e,r){b.GoogleAnalyticsObject=l;b[l]||(b[l]=
            function(){(b[l].q=b[l].q||[]).push(arguments)});b[l].l=+new Date;
            e=o.createElement(i);r=o.getElementsByTagName(i)[0];
            e.src='//www.google-analytics.com/analytics.js';
            r.parentNode.insertBefore(e,r)}(window,document,'script','ga'));
            ga('create','UA-XXXXX-X','auto');ga('send','pageview');
        </script>
        <script>
            document.getElementById('navigation').addEventListener('click', function (event) {
                if (event.target.closest('a') && window.matchMedia('(max-width: 768px)').matches) {
                    this.style.display = '';
                    document.getElementById('menu').classList.remove('border');
                }
            });
        </script>
    </body>
</html>
