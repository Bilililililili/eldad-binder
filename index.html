<!doctype html>
<html class="no-js" lang="">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        <link rel="shortcut icon" href="favicon.ico?v=2" />
        <link rel="stylesheet" href="style.css">

        <script src="js/vendor/modernizr-2.8.3.min.js"></script>
        <style>

            @media (max-width: 768px) {
                #background-site:has(iframe[src^="https://docs.google.com/document/"]) {
                    overflow-x: auto;
                    direction: rtl;
                }
                #background-site:has(iframe[src^="https://docs.google.com/document/"]) .docs-frame {
                    display: block;
                    position: relative;
                    width: var(--docs-render-width, 100%);
                    height: var(--docs-render-height, 5500px);
                    overflow: hidden;
                    direction: ltr;
                }
                #background-site iframe[src^="https://docs.google.com/document/"] {
                    position: absolute;
                    inset: 0 auto auto 0;
                    width: var(--docs-layout-width, calc(100% / 0.85));
                    transform: scale(var(--docs-fit-scale, 0.85));
                    transform-origin: top left;
                }
                #menu:not(.border),
                #menu.border {
                    left: auto;
                    right: 6px;
                    top: 6px;
                    box-sizing: border-box;
                    cursor: default;
                }
                #menu.border {
                    width: min(18rem, calc(100vw - 18px));
                    max-height: calc(100vh - 18px);
                    max-height: calc(100dvh - 18px);
                    overflow-y: auto;
                    background: #fff;
                }
                #menu #navigation {
                    direction: rtl;
                    text-align: right;
                    text-indent: 0;
                    margin: 0;
                }
                #menu #navigation a {
                    display: block;
                    padding: 7px 8px;
                    font-size: 17px;
                    line-height: 1.3;
                }
                #menu:not(.border) {
                    padding: 4px;
                    background: #fff;
                    border-color: #f00;
                    box-shadow: none;
                }
                #menu #menu-open {
                    width: 44px;
                    height: 44px;
                    box-sizing: border-box;
                    padding: 10px;
                }
                #menu #menu-open div {
                    width: 24px;
                    height: 3px;
                    margin-bottom: 5px;
                    background: #f00;
                    border: 0;
                }
                #background-site iframe[src^="https://docs.google.com/presentation/"],
                #background-site iframe[src^="https://player.vimeo.com/video/"] {
                    position: absolute;
                    inset: 68px 0 auto;
                    height: min(calc(56.25vw + 40px), calc(100vh - 68px));
                    height: min(calc(56.25vw + 40px), calc(100dvh - 68px));
                }
            }
            #navigation .clown-group-heading {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: .5rem;
            }
            #navigation .clown-submenu {
                list-style: none;
                margin: 0 0 0 1rem;
                padding: 0;
            }
            #navigation .clown-submenu[hidden] { display: none; }
            #clown-submenu-toggle {
                background: none;
                border: 0;
                color: #f00;
                cursor: pointer;
                font: 700 1.2rem/1 Assistant, Arial, sans-serif;
                min-width: 32px;
                min-height: 32px;
            }
            @media (max-width: 768px) {
                #menu #navigation .clown-group-heading > a { padding-right: 20px; }
                #navigation .clown-submenu { margin: 0; }
                #menu #navigation .clown-submenu a { padding-right: 8px; }
                #clown-submenu-toggle { min-width: 44px; min-height: 44px; }
            }
            .docs-frame { display: contents; }
        </style>
    </head>
    <body>
        <!--[if lt IE 8]>
            <p class="browserupgrade">You are using an <strong>outdated</strong> browser. Please <a href="http://browsehappy.com/">upgrade your browser</a> to improve your experience.</p>
        <![endif]-->
        <img id="logo" src="logo.png">
        <div class="about"></div>

        <div id="menu">
            <!-- <img id="binder-clip" src="binder-clip.png">  -->   
            <div id="menu-open" role="button" tabindex="0" aria-label="תפריט" aria-controls="navigation" aria-expanded="false">
                <div></div>
                <div></div>
                <div></div>
            </div>
            <img id="logo-touch" src="logo.png">
            <ul id="navigation">
            </ul>
        </div>

        <div id="background-site"><div class="docs-frame"><iframe name="backgrnd" id="backgrnd" scrolling="yes" src="https://docs.google.com/document/d/1m0et2yGFUoDVUjCCnqdZgVwPyfdmjhFwtf1p2NPjK2w/preview" allowfullscreen></iframe></div></div>

        <script>
            (function () {
                const fallback = {"title":"אלדד","logo":"logo.png","about":"","menu":{"אלדד פריבס":"https://docs.google.com/document/d/1m0et2yGFUoDVUjCCnqdZgVwPyfdmjhFwtf1p2NPjK2w/preview","סדנאות":"https://docs.google.com/document/d/1O8Nr1SQ75L4Yb9sfUB74s_Wzvw4tbGr7D7T-tfVcU0o/preview","הוראה בימוי וכתיבה":"https://docs.google.com/document/d/197cpoAgaaKCuFmlGimBZWLrO5M2XWRJATNyhqHfS5Cc/preview","יעוץ אומנותי":"https://docs.google.com/document/d/1Ihone-OIxl8RSKj45YPx7zDCUA6opI2agoOlh-hQZKg/preview","קולנוע דוקומנטרי":"https://docs.google.com/document/d/1n0Q4A-WHpqcx7ygkSvQ-dCSjOnoywbGamdNK1H5rD8M/preview","הליצן איקס":"https://www.clownx.org/","ממלכת שן הזהב התיכונה":"https://www.clownx.org/golden-tooth-kingdom","הקונסוליה":"https://player.vimeo.com/video/1055895954","יחידת ה104":"https://www.kipodhazahav.co.il/he/112/269","שואו ריל הליצן איקס":"https://player.vimeo.com/video/745312686"}};
                const hidden = {
                    wikipedia: 'https://he.wikipedia.org/wiki/%D7%90%D7%9C%D7%93%D7%93_%D7%A4%D7%A8%D7%99%D7%91%D7%A1',
                    agency: 'https://www.zohar-agency.com/actor/%D7%90%D7%9C%D7%93%D7%93-%D7%A4%D7%A8%D7%99%D7%91%D7%A1/',
                    himalaya: 'https://player.vimeo.com/video/912989415',
                    'red-nose': 'https://www.cultureunplugged.com/documentary/watch-online/play/9611/red-nose'
                };
                const clown = 'הליצן איקס';
                const defaultChildren = ['ממלכת שן הזהב התיכונה', 'הקונסוליה', 'יחידת ה104', 'שואו ריל הליצן איקס'];
                const menu = document.getElementById('menu');
                const menuButton = document.getElementById('menu-open');
                const nav = document.getElementById('navigation');
                const frame = document.getElementById('backgrnd');
                const mobile = matchMedia('(max-width: 768px), (pointer: coarse)');
                let current;
                let submenu;
                let toggle;

                function selected() {
                    try { return decodeURIComponent(location.hash.slice(1)); }
                    catch (_) { return ''; }
                }

                function setSubmenu(open) {
                    if (!submenu) return;
                    submenu.hidden = !open;
                    toggle.textContent = open ? '−' : '+';
                    toggle.setAttribute('aria-expanded', String(open));
                    toggle.setAttribute('aria-label', open ? 'הסתרת עמודי הליצן איקס' : 'הצגת עמודי הליצן איקס');
                }

                function setMenu(open) {
                    menu.classList.toggle('border', open);
                    nav.style.display = open ? 'block' : '';
                    menuButton.setAttribute('aria-expanded', String(open));
                    if (!open) setSubmenu(false);
                }

                function fitDocument() {
                    const source = frame.getAttribute('src') || '';
                    if (!source.startsWith('https://docs.google.com/document/')) return;
                    const available = document.documentElement.clientWidth;
                    const home = source.includes('/1m0et2yGFUoDVUjCCnqdZgVwPyfdmjhFwtf1p2NPjK2w/');
                    const documentary = source.includes('/1n0Q4A-WHpqcx7ygkSvQ-dCSjOnoywbGamdNK1H5rD8M/');
                    const minimum = home ? 530 : documentary ? 1080 : 840;
                    const layoutWidth = Math.max(minimum, Math.ceil(available / 0.85));
                    frame.style.setProperty('--docs-layout-width', layoutWidth + 'px');
                    const scale = Math.max(0.72, available / layoutWidth);
                    frame.style.setProperty('--docs-fit-scale', scale);
                    frame.parentElement.style.setProperty('--docs-render-width', Math.ceil(layoutWidth * scale) + 'px');
                    frame.parentElement.style.setProperty('--docs-render-height', Math.ceil(5500 * scale) + 'px');
                }

                function showPage() {
                    const page = selected();
                    const key = current.routes.has(page) ? page : current.home;
                    const src = current.routes.get(key);
                    if (frame.getAttribute('src') !== src) {
                        frame.setAttribute('src', src);
                        frame.parentElement.parentElement.scrollTo(0, 0);
                    }
                    fitDocument();
                    nav.querySelectorAll('a[data-key]').forEach(link => link.classList.toggle('active', link.dataset.key === key));
                }

                function menuItem(row) {
                    const item = document.createElement('li');
                    const link = document.createElement('a');
                    link.href = '#' + encodeURIComponent(row.key);
                    link.dataset.key = row.key;
                    link.textContent = row.label;
                    item.appendChild(link);
                    return item;
                }

                function render(data) {
                    const wasExpanded = !!submenu && !submenu.hidden;
                    current = data;
                    nav.textContent = '';
                    submenu = null;
                    toggle = null;
                    data.main.forEach(row => {
                        const item = menuItem(row);
                        nav.appendChild(item);
                        if (row.key !== clown || !data.children.length) return;
                        item.className = 'clown-group-heading';
                        toggle = document.createElement('button');
                        toggle.id = 'clown-submenu-toggle';
                        toggle.type = 'button';
                        toggle.setAttribute('aria-controls', 'clown-submenu');
                        item.appendChild(toggle);
                        const group = document.createElement('li');
                        submenu = document.createElement('ul');
                        submenu.id = 'clown-submenu';
                        submenu.className = 'clown-submenu';
                        data.children.forEach(child => submenu.appendChild(menuItem(child)));
                        group.appendChild(submenu);
                        nav.appendChild(group);
                        setSubmenu(wasExpanded || (!mobile.matches && (selected() === clown || data.children.some(child => child.key === selected()))));
                    });
                    showPage();
                }

                function localData(menuConfig) {
                    const rows = Object.keys(menuConfig).map(key => ({ key, label: key }));
                    return {
                        main: rows.filter(row => !defaultChildren.includes(row.key)),
                        children: rows.filter(row => defaultChildren.includes(row.key)),
                        routes: new Map(Object.entries(Object.assign({}, hidden, menuConfig))),
                        home: rows[0].key
                    };
                }

                function targetUrl(source) {
                    const url = new URL(source);
                    if (url.protocol !== 'https:' || url.username || url.password || url.origin === location.origin) return '';
                    if (url.hostname === 'docs.google.com') {
                        const parts = url.pathname.split('/');
                        if (parts[3] && parts[1] === 'document' && parts[2] === 'd') return url.origin + '/document/d/' + parts[3] + '/preview';
                        if (parts[3] && parts[1] === 'presentation' && parts[2] === 'd') return url.origin + '/presentation/d/' + parts[3] + '/embed?start=false';
                    }
                    if (url.hostname === 'vimeo.com' && /^\/\d+\/?$/.test(url.pathname)) return 'https://player.vimeo.com/video/' + url.pathname.split('/')[1];
                    return url.href;
                }

                async function sheetRows(gid) {
                    const url = new URL('https://docs.google.com/spreadsheets/d/1PXbL9Ucf8s4-4seusrccddy33aeo8y5YmQ7WQ2nydjc/gviz/tq');
                    url.search = new URLSearchParams({ gid, headers: 1, tq: 'select A,B,C,D,E', tqx: 'out:json;responseHandler:binderSheet' });
                    const response = await fetch(url, { credentials: 'omit', cache: 'no-store' });
                    if (!response.ok) throw new Error('Sheet unavailable');
                    const body = (await response.text()).trim();
                    const start = body.indexOf('binderSheet(');
                    if (start < 0 || !body.endsWith(');')) throw new Error('Invalid sheet response');
                    const result = JSON.parse(body.slice(start + 'binderSheet('.length, -2));
                    if (result.status !== 'ok' || !result.table || !Array.isArray(result.table.rows)) throw new Error('Invalid sheet data');
                    return result.table.rows.map(row => row.c.map(cell => String(cell && cell.v != null ? cell.v : '').trim()));
                }

                function sheetData(visible, direct) {
                    const data = { main: [], children: [], routes: new Map(Object.entries(hidden)), home: '' };
                    const seen = new Set();
                    visible.concat(direct).forEach((row, index) => {
                        const [label, source, group, type, key] = row;
                        if (!label || !source || !key || seen.has(key)) return;
                        let url;
                        try { url = targetUrl(source); } catch (_) { return; }
                        if (!url) return;
                        seen.add(key);
                        data.routes.set(key, url);
                        if (index >= visible.length) return;
                        if (group === 'תפריט ראשי') {
                            data.main.push({ label, key });
                            if (type === 'ראשי') data.home = key;
                        } else if (group === 'תחת הליצן איקס') {
                            data.children.push({ label, key });
                        }
                    });
                    if (!data.home || !data.main.some(row => row.key === clown)) throw new Error('Incomplete navigation');
                    return data;
                }

                menuButton.addEventListener('click', () => {
                    const open = !menu.classList.contains('border');
                    setSubmenu(false);
                    setMenu(open);
                });
                menuButton.addEventListener('keydown', event => {
                    if (event.key !== 'Enter' && event.key !== ' ') return;
                    event.preventDefault();
                    menuButton.click();
                });
                nav.addEventListener('click', event => {
                    const link = event.target.closest('a[data-key]');
                    if (toggle && event.target.closest('button') === toggle) {
                        if (submenu.hidden) {
                            setSubmenu(true);
                            location.hash = encodeURIComponent(clown);
                        } else setSubmenu(false);
                    } else if (link) {
                        if (link.dataset.key === clown) setSubmenu(true);
                        else if (mobile.matches) setMenu(false);
                    }
                });
                window.addEventListener('hashchange', showPage);
                window.addEventListener('resize', () => {
                    fitDocument();
                    if (mobile.matches) menu.style.cssText = '';
                    if (!mobile.matches) setMenu(false);
                });
                if (/Android|iPhone|iPad|iPod|IEMobile|Opera Mini/i.test(navigator.userAgent)) document.body.classList.add('touch-device');
                menu.addEventListener('pointerdown', event => {
                    if (mobile.matches || event.button !== 0 || event.target.closest('a, button, #menu-open')) return;
                    const bounds = menu.getBoundingClientRect();
                    const move = next => {
                        menu.style.left = Math.max(0, bounds.left + next.clientX - event.clientX) + 'px';
                        menu.style.top = Math.max(0, bounds.top + next.clientY - event.clientY) + 'px';
                    };
                    menu.setPointerCapture(event.pointerId);
                    menu.addEventListener('pointermove', move);
                    menu.addEventListener('lostpointercapture', () => menu.removeEventListener('pointermove', move), { once: true });
                });
                render(localData(fallback.menu));
                Promise.all([sheetRows('1663950710'), sheetRows('729104220')])
                    .then(([visible, direct]) => render(sheetData(visible, direct)))
                    .catch(() => {});
            }());
        </script>
    </body>
</html>
