<!doctype html>
<html class="no-js" lang="">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        <link rel="shortcut icon" href="favicon.ico?v=2" />
        <link rel="stylesheet" href="style.css">

        <script src="js/vendor/modernizr-2.8.3.min.js"></script>
        <style>
            #open-media { display: none; }
            @media (max-width: 768px) {
                #background-site:has(#open-media[href^="https://vimeo.com/"]) #open-media {
                    display: block;
                    position: absolute;
                    inset: 68px 12px auto;
                    min-height: 44px;
                    padding: 8px;
                    box-sizing: border-box;
                    text-align: center;
                    color: #ba1717;
                    background: #fff;
                    font: 700 17px/28px Assistant, Arial, sans-serif;
                }
                #background-site:has(#open-media[href]) iframe {
                    position: absolute;
                    inset: 112px 0 auto;
                    height: min(calc(56.25vw + 40px), calc(100vh - 112px));
                    height: min(calc(56.25vw + 40px), calc(100dvh - 112px));
                }
                #background-site:has(#open-media[href^="https://docs.google.com/"]) iframe {
                    top: 68px;
                    height: min(calc(56.25vw + 40px), calc(100vh - 68px));
                    height: min(calc(56.25vw + 40px), calc(100dvh - 68px));
                }
            }
        </style>
    </head>
    <body>
        <!--[if lt IE 8]>
            <p class="browserupgrade">You are using an <strong>outdated</strong> browser. Please <a href="http://browsehappy.com/">upgrade your browser</a> to improve your experience.</p>
        <![endif]-->
        <img id="logo" src="logo.png">
        <div class="about"></div>

        <div id="menu">
            <!-- <img id="binder-clip" src="binder-clip.png">  -->   
            <div id="menu-open">
                <div></div>
                <div></div>
                <div></div>
            </div>
            <img id="logo-touch" src="logo.png">
            <ul id="navigation">
            </ul>
        </div>

        <div id="background-site"><a id="open-media" target="_blank" rel="noopener" lang="he" dir="rtl"></a><iframe name="backgrnd" id="backgrnd" scrolling="yes" src="" allowfullscreen></iframe></div>

        <script src="//ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
        <script>window.jQuery || document.write('<script src="js/vendor/jquery-1.11.2.min.js"><\/script>')</script>
        <script src="//code.jquery.com/ui/1.11.4/jquery-ui.js"></script>
        <script src="js/vendor/jquery.ui.touch-punch.min.js"></script>
        <script src="js/google-docs-site.1.0.js"></script>

        <!-- Google Analytics: change UA-XXXXX-X to be your site's ID. -->
        <script>
            (function(b,o,i,l,e,r){b.GoogleAnalyticsObject=l;b[l]||(b[l]=
            function(){(b[l].q=b[l].q||[]).push(arguments)});b[l].l=+new Date;
            e=o.createElement(i);r=o.getElementsByTagName(i)[0];
            e.src='//www.google-analytics.com/analytics.js';
            r.parentNode.insertBefore(e,r)}(window,document,'script','ga'));
            ga('create','UA-XXXXX-X','auto');ga('send','pageview');
        </script>
        <script>
            const mediaFrame = document.getElementById('backgrnd');
            const mediaLink = document.getElementById('open-media');
            function updateMediaLink() {
                const src = mediaFrame.getAttribute('src') || '';
                const slides = /^https:\/\/docs\.google\.com\/presentation\/d\/([^/]+)/.exec(src);
                const video = /^https:\/\/player\.vimeo\.com\/video\/(\d+)$/.exec(src);
                if (slides) {
                    mediaLink.href = 'https://docs.google.com/presentation/d/' + slides[1] + '/present';
                    mediaLink.textContent = 'פתיחת המצגת בחלון חדש';
                } else if (video) {
                    mediaLink.href = 'https://vimeo.com/' + video[1];
                    mediaLink.textContent = 'צפייה בסרטון ב־Vimeo';
                } else {
                    mediaLink.removeAttribute('href');
                    mediaLink.textContent = '';
                }
            }
            new MutationObserver(updateMediaLink).observe(mediaFrame, { attributes: true, attributeFilter: ['src'] });
            updateMediaLink();
        </script>
    </body>
</html>
