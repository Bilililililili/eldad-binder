<!doctype html>
<html class="no-js" lang="">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        <link rel="shortcut icon" href="favicon.ico?v=2" />
        <link rel="stylesheet" href="style.css">

        <script src="js/vendor/modernizr-2.8.3.min.js"></script>
        <style>

            @media (max-width: 768px) {
                #background-site:has(iframe[src^="https://docs.google.com/document/"]) {
                    overflow-x: hidden;
                }
                #background-site iframe[src^="https://docs.google.com/document/"] {
                    width: calc(100% / 0.85);
                    transform: scale(0.85);
                    transform-origin: top left;
                }
                #menu:not(.border),
                #menu.border {
                    left: auto;
                    right: 6px;
                    top: 6px;
                    box-sizing: border-box;
                    cursor: default;
                }
                #menu.border {
                    width: min(18rem, calc(100vw - 18px));
                    max-height: calc(100vh - 18px);
                    max-height: calc(100dvh - 18px);
                    overflow-y: auto;
                    background: #fff;
                }
                #menu #navigation {
                    direction: rtl;
                    text-align: right;
                    text-indent: 0;
                    margin: 0;
                }
                #menu #navigation a {
                    display: block;
                    padding: 7px 8px;
                    font-size: 17px;
                    line-height: 1.3;
                }
                #menu:not(.border) {
                    padding: 4px;
                    background: transparent;
                    border-color: transparent;
                    box-shadow: none;
                }
                #menu #menu-open {
                    width: 44px;
                    height: 44px;
                    box-sizing: border-box;
                    padding: 10px;
                }
                #menu #menu-open div {
                    width: 24px;
                    height: 3px;
                    margin-bottom: 5px;
                    background: #f00;
                    border: 0;
                }
                #background-site iframe[src^="https://docs.google.com/presentation/"],
                #background-site iframe[src^="https://player.vimeo.com/video/"] {
                    position: absolute;
                    inset: 68px 0 auto;
                    height: min(calc(56.25vw + 40px), calc(100vh - 68px));
                    height: min(calc(56.25vw + 40px), calc(100dvh - 68px));
                }
            }
            #navigation .clown-group-heading {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: .5rem;
            }
            #navigation .clown-submenu {
                list-style: none;
                margin: 0 0 0 1rem;
                padding: 0;
            }
            #navigation .clown-submenu[hidden] { display: none; }
            #clown-submenu-toggle {
                background: none;
                border: 0;
                color: #f00;
                cursor: pointer;
                font: 700 1.2rem/1 Assistant, Arial, sans-serif;
                min-width: 32px;
                min-height: 32px;
            }
            @media (max-width: 768px) {
                #navigation .clown-group-heading > a { padding-right: 20px; }
                #navigation .clown-submenu { margin: 0; }
                #menu #navigation .clown-submenu a { padding-right: 8px; }
                #clown-submenu-toggle { min-width: 44px; min-height: 44px; }
            }
        </style>
    </head>
    <body>
        <!--[if lt IE 8]>
            <p class="browserupgrade">You are using an <strong>outdated</strong> browser. Please <a href="http://browsehappy.com/">upgrade your browser</a> to improve your experience.</p>
        <![endif]-->
        <img id="logo" src="logo.png">
        <div class="about"></div>

        <div id="menu">
            <!-- <img id="binder-clip" src="binder-clip.png">  -->   
            <div id="menu-open">
                <div></div>
                <div></div>
                <div></div>
            </div>
            <img id="logo-touch" src="logo.png">
            <ul id="navigation">
            </ul>
        </div>

        <div id="background-site"><iframe name="backgrnd" id="backgrnd" scrolling="yes" src="" allowfullscreen></iframe></div>

        <script src="//ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
        <script>window.jQuery || document.write('<script src="js/vendor/jquery-1.11.2.min.js"><\/script>')</script>
        <script src="//code.jquery.com/ui/1.11.4/jquery-ui.js"></script>
        <script src="js/vendor/jquery.ui.touch-punch.min.js"></script>
        <script>
            jQuery.ajaxPrefilter(function (options) {
                if (options.url === 'info.json') options.cache = false;
            });
        </script>
        <script src="js/google-docs-site.1.0.js?v=agency"></script>

        <!-- Google Analytics: change UA-XXXXX-X to be your site's ID. -->
        <script>
            (function(b,o,i,l,e,r){b.GoogleAnalyticsObject=l;b[l]||(b[l]=
            function(){(b[l].q=b[l].q||[]).push(arguments)});b[l].l=+new Date;
            e=o.createElement(i);r=o.getElementsByTagName(i)[0];
            e.src='//www.google-analytics.com/analytics.js';
            r.parentNode.insertBefore(e,r)}(window,document,'script','ga'));
            ga('create','UA-XXXXX-X','auto');ga('send','pageview');
        </script>
        <script>
            const navigation = document.getElementById('navigation');
            const clownPage = 'הליצן איקס';
            const clownChildren = ['ממלכת שן הזהב התיכונה', 'הקונסוליה', 'יחידת ה104', 'שואו ריל הליצן איקס'];
            let clownSubmenu;
            let clownToggle;

            function setClownSubmenu(open) {
                clownSubmenu.hidden = !open;
                clownToggle.textContent = open ? '−' : '+';
                clownToggle.setAttribute('aria-expanded', String(open));
                clownToggle.setAttribute('aria-label', open ? 'הסתרת עמודי הליצן איקס' : 'הצגת עמודי הליצן איקס');
            }

            function addClownSubmenu() {
                const items = new Map(Array.from(navigation.children, item => [item.textContent.trim(), item]));
                const parentItem = items.get(clownPage);
                if (!parentItem || !clownChildren.every(label => items.has(label))) return;
                menuObserver.disconnect();
                const group = document.createElement('li');
                clownSubmenu = document.createElement('ul');
                clownSubmenu.className = 'clown-submenu';
                clownSubmenu.id = 'clown-submenu';
                group.appendChild(clownSubmenu);
                parentItem.after(group);
                clownChildren.forEach(label => clownSubmenu.appendChild(items.get(label)));
                parentItem.classList.add('clown-group-heading');
                clownToggle = document.createElement('button');
                clownToggle.type = 'button';
                clownToggle.id = 'clown-submenu-toggle';
                clownToggle.setAttribute('aria-controls', clownSubmenu.id);
                clownToggle.addEventListener('click', () => setClownSubmenu(clownSubmenu.hidden));
                parentItem.appendChild(clownToggle);
                const page = decodeURIComponent(location.hash.slice(1));
                setClownSubmenu(page === clownPage || clownChildren.includes(page));
            }

            const menuObserver = new MutationObserver(addClownSubmenu);
            menuObserver.observe(navigation, { childList: true });
            addClownSubmenu();

            navigation.addEventListener('click', function (event) {
                const link = event.target.closest('a');
                if (!link) return;
                if (clownSubmenu && link.textContent.trim() === clownPage) {
                    setClownSubmenu(true);
                    return;
                }
                if (window.matchMedia('(max-width: 768px)').matches) {
                    this.style.display = '';
                    document.getElementById('menu').classList.remove('border');
                }
            });
        </script>
    </body>
</html>
